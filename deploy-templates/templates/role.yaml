apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codebase-operator.labels" . | nindent 4 }}
  name: edp-{{ .Values.name }}
# Hand-maintained. Mirrors config/rbac/role.yaml (`make manifests`).
# Not enforced: copy marker changes across by hand.
rules:
- apiGroups:
    - ""
  resources:
    - configmaps
  verbs:
    - get
- apiGroups:
    - ""
  resources:
    - events
  verbs:
    - create
    - patch
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - delete
    - get
    - list
    - update
    - watch
- apiGroups:
    - coordination.k8s.io
  resources:
    - leases
  verbs:
    - create
    - get
    - update
- apiGroups:
    - tekton.dev
  resources:
    - pipelineruns
  verbs:
    - create
    - list
    - watch
- apiGroups:
    - triggers.tekton.dev
  resources:
    - eventlisteners
  verbs:
    - create
    - get
    - patch
- apiGroups:
    - triggers.tekton.dev
  resources:
    - triggertemplates
  verbs:
    - get
- apiGroups:
    - v2.edp.epam.com
  resources:
    - cdpipelines
    - stages
  verbs:
    - get
    - list
- apiGroups:
    - v2.edp.epam.com
  resources:
    - cdstagedeployments
    - codebasebranches
    - codebaseimagestreams
    - codebases
    - gitservers
    - jiraissuemetadatas
    - jiraservers
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - v2.edp.epam.com
  resources:
    - cdstagedeployments/finalizers
    - codebasebranches/finalizers
    - codebaseimagestreams/finalizers
    - codebases/finalizers
    - gitservers/finalizers
    - jiraissuemetadatas/finalizers
    - jiraservers/finalizers
  verbs:
    - update
- apiGroups:
    - v2.edp.epam.com
  resources:
    - cdstagedeployments/status
    - codebasebranches/status
    - codebaseimagestreams/status
    - codebases/status
    - gitservers/status
    - jiraissuemetadatas/status
    - jiraservers/status
  verbs:
    - get
    - patch
    - update
- apiGroups:
    - v2.edp.epam.com
  resources:
    - quicklinks
  verbs:
    - get
{{- if eq .Values.global.platform "openshift" }}
- apiGroups:
    - route.openshift.io
  resources:
    - routes
  verbs:
    - create
    - get
{{- else }}
- apiGroups:
    - gateway.networking.k8s.io
  resources:
    - httproutes
  verbs:
    - create
    - get
- apiGroups:
    - networking.k8s.io
  resources:
    - ingresses
  verbs:
    - create
    - get
{{- end }}
