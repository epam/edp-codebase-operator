apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "codebase-operator.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: {{ .Values.name }}
  template:
    metadata:
      labels:
        name: {{ .Values.name }}
        {{- if hasKey .Values.podLabels "name" }}
        {{ fail "The 'name' key is not allowed in podLabels" }}
        {{- end }}
        {{- range $key, $value := .Values.podLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      serviceAccountName: edp-{{ .Values.name }}
      {{- if .Values.podSecurityContext }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.name }}
          image: {{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          args:
            - --leader-elect
          {{- if .Values.enableWebhooks }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          {{- end }}
          volumeMounts:
            {{- if .Values.enableWebhooks }}
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
            {{- end }}
            # A directory mount, not subPath: the kubelet only refreshes in-place
            # directory mounts, so host keys added to the ConfigMap take effect
            # without restarting the operator.
            - mountPath: /etc/codebase-operator/ssh
              name: ssh-known-hosts
              readOnly: true
            {{- if .Values.caCerts.enabled }}
            - mountPath: /etc/ssl/custom-certs
              name: ca-certs
              readOnly: true
            {{- end }}
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          {{- if .Values.securityContext }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: {{ .Values.name }}
            - name: PLATFORM_TYPE
              value: "{{ .Values.global.platform }}"
            - name: INGRESS_CONTROLLER_TYPE
              value: "{{ .Values.ingressController }}"
            - name: GATEWAY_NAME
              value: "{{ (.Values.global.gatewayApi | default dict).gatewayName | default "main-gateway" }}"
            - name: GATEWAY_NAMESPACE
              value: "{{ (.Values.global.gatewayApi | default dict).gatewayNamespace | default "envoy-gateway-system" }}"
            - name: TELEMETRY_ENABLED
              value: "{{ .Values.telemetryEnabled }}"
            - name: ENABLE_WEBHOOKS
              value: {{ .Values.enableWebhooks | quote }}
            - name: BRANCH_STALE_CHECK_INTERVAL
              value: {{ .Values.branchStaleCheckInterval | quote }}
            - name: SSH_KNOWN_HOSTS
              value: /etc/codebase-operator/ssh/ssh_known_hosts
            {{- if .Values.caCerts.enabled }}
            # SSL_CERT_DIR replaces Go's default scan directories, so the system
            # bundle location must stay on the list next to the mounted CAs.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/ssl/custom-certs
            {{- end }}
{{ toYaml .Values.envs | indent 12 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.enableWebhooks }}
        - name: cert
          secret:
            defaultMode: 420
            secretName: {{ .Values.name }}-webhook-certs
        {{- end }}
        - name: ssh-known-hosts
          configMap:
            name: {{ .Values.name }}-ssh-known-hosts
        {{- if .Values.caCerts.enabled }}
        - name: ca-certs
          secret:
            secretName: {{ .Values.caCerts.secret }}
        {{- end }}
